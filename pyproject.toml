[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "undomesh"
version = "0.1.0"
description = "A replayable multi-provider coding agent with durable recovery and prompt rewind"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "UndoMesh Team" },
]
keywords = ["ai", "agent", "coding", "harness", "recovery", "tool-use"]

dependencies = [
    "openai>=1.50.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "rich>=13.0",
    "typer>=0.12",
    "tiktoken>=0.7",
    "aiosqlite>=0.20",
    "python-dotenv>=1.0",
    "prompt-toolkit>=3.0",
    "cryptography>=42.0",
]

[project.optional-dependencies]
credentials = [
    "keyring>=25.0",
]
performance = [
    "zstandard>=0.23",
    "fastcdc>=1.7",
]
telemetry = [
    "opentelemetry-api>=1.27",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp>=1.27",
]
desktop = [
    "pyinstaller>=6.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.0",
]

[project.scripts]
undomesh = "undomesh.__main__:main"
undomesh-desktop = "undomesh.ui.desktop:launch_desktop"
undomesh-server = "undomesh.__main__:main"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["undomesh"]
